<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="RAG pipeline">
  <defs><style>.bg{fill:#ffffff}.title{font:700 28px Arial,"Microsoft YaHei";fill:#14171f}.box{fill:white;stroke:#dbe5ff;stroke-width:1.5;rx:16}.head{font:700 15px Arial,"Microsoft YaHei";fill:#14171f}.txt{font:12.5px Arial,"Microsoft YaHei";fill:#555f73}.line{stroke:#2454d6;stroke-width:2;fill:none;marker-end:url(#a)}.pill{fill:#f4f7ff;stroke:#bac9f4}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#2454d6"/></marker></defs>
  <rect width="1280" height="620" class="bg"/><text x="54" y="54" class="title">RAG 检索与生成链路</text>
  <g transform="translate(54,105)"><rect width="150" height="110" class="box"/><text x="22" y="35" class="head">上传解析</text><text x="22" y="65" class="txt">DOCX / PDF / OCR</text><text x="22" y="88" class="txt">CSV / XLSX / TXT</text></g>
  <g transform="translate(244,105)"><rect width="150" height="110" class="box"/><text x="22" y="35" class="head">结构切片</text><text x="22" y="65" class="txt">整章成块 / 条款号</text><text x="22" y="88" class="txt">页码 / Sheet / 行号</text></g>
  <g transform="translate(434,105)"><rect width="150" height="110" class="box"/><text x="22" y="35" class="head">向量入库</text><text x="22" y="65" class="txt">BGE-M3 Embedding</text><text x="22" y="88" class="txt">enterprise_id + kb_id</text></g>
  <g transform="translate(54,330)"><rect width="150" height="110" class="box"/><text x="22" y="35" class="head">用户问题</text><text x="22" y="65" class="txt">条款号识别</text><text x="22" y="88" class="txt">查询改写</text></g>
  <g transform="translate(244,330)"><rect width="150" height="110" class="box"/><text x="22" y="35" class="head">混合检索</text><text x="22" y="65" class="txt">向量 + BM25</text><text x="22" y="88" class="txt">精确召回 + 过滤</text></g>
  <g transform="translate(434,330)"><rect width="150" height="110" class="box"/><text x="22" y="35" class="head">融合重排</text><text x="22" y="65" class="txt">去重 / Rerank</text><text x="22" y="88" class="txt">超时自动降级</text></g>
  <g transform="translate(650,220)"><rect width="170" height="130" class="box"/><text x="25" y="40" class="head">证据上下文</text><text x="25" y="72" class="txt">知识库来源</text><text x="25" y="96" class="txt">会话附件来源</text></g>
  <g transform="translate(890,220)"><rect width="170" height="130" class="box"/><text x="25" y="40" class="head">约束生成</text><text x="25" y="72" class="txt">引用依据</text><text x="25" y="96" class="txt">无依据拒答</text></g>
  <g transform="translate(1110,220)"><rect width="120" height="130" class="box"/><text x="25" y="40" class="head">结果</text><text x="25" y="72" class="txt">答案</text><text x="25" y="96" class="txt">引用</text></g>
  <path d="M204 160 L244 160" class="line"/><path d="M394 160 L434 160" class="line"/><path d="M204 385 L244 385" class="line"/><path d="M394 385 L434 385" class="line"/><path d="M584 385 C625 385 620 285 650 285" class="line"/><path d="M584 160 C630 160 620 270 650 270" class="line"/><path d="M820 285 L890 285" class="line"/><path d="M1060 285 L1110 285" class="line"/>
  <rect x="650" y="420" width="410" height="58" rx="14" class="pill"/><text x="680" y="455" class="txt">评测反馈：Top-K、章节命中、证据命中、答案覆盖、引用正确、拒答正确</text>
</svg>
