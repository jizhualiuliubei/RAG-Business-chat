<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="database ER diagram">
  <defs><style>.bg{fill:#ffffff}.title{font:700 28px Arial,"Microsoft YaHei";fill:#14171f}.entity{fill:#fff;stroke:#dbe5ff;stroke-width:1.5;rx:14}.name{font:700 14px Arial,"Microsoft YaHei";fill:#14171f}.field{font:12px Consolas,Arial;fill:#555f73}.line{stroke:#555f73;stroke-width:1.8;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="#555f73"/></marker></defs>
  <rect width="1280" height="760" class="bg"/><text x="48" y="700" class="field" style="font-size:13px">另含 user_profile（会话级用户档案）、evaluation_dataset_case（题集明细）、evaluation_case_result（逐题结果）三张表。</text><text x="48" y="50" class="title">核心数据库关系设计</text>
  <g transform="translate(60,95)"><rect width="190" height="130" class="entity"/><text x="18" y="28" class="name">enterprise</text><text x="18" y="58" class="field">id · code · name</text><text x="18" y="82" class="field">status · contact</text><text x="18" y="106" class="field">reviewed_by · deleted</text></g>
  <g transform="translate(330,95)"><rect width="190" height="130" class="entity"/><text x="18" y="28" class="name">users</text><text x="18" y="58" class="field">id · enterprise_id</text><text x="18" y="82" class="field">username · role</text><text x="18" y="106" class="field">display_name · status</text></g>
  <g transform="translate(600,95)"><rect width="210" height="130" class="entity"/><text x="18" y="28" class="name">enterprise_model_key</text><text x="18" y="58" class="field">enterprise_id</text><text x="18" y="82" class="field">deepseek_* · siliconflow_*</text><text x="18" y="106" class="field">encrypted_key · masked</text></g>
  <g transform="translate(60,290)"><rect width="190" height="130" class="entity"/><text x="18" y="28" class="name">knowledge_base</text><text x="18" y="58" class="field">id · enterprise_id</text><text x="18" y="82" class="field">name · description</text><text x="18" y="106" class="field">created_by</text></g>
  <g transform="translate(330,290)"><rect width="190" height="130" class="entity"/><text x="18" y="28" class="name">document</text><text x="18" y="58" class="field">id · enterprise_id · kb_id</text><text x="18" y="82" class="field">filename · status</text><text x="18" y="106" class="field">chunk_count · failure_reason</text></g>
  <g transform="translate(600,290)"><rect width="190" height="130" class="entity"/><text x="18" y="28" class="name">conversation</text><text x="18" y="58" class="field">id · enterprise_id</text><text x="18" y="82" class="field">user_id · title</text><text x="18" y="106" class="field">created_at · updated_at</text></g>
  <g transform="translate(870,290)"><rect width="190" height="130" class="entity"/><text x="18" y="28" class="name">message</text><text x="18" y="58" class="field">id · conversation_id</text><text x="18" y="82" class="field">enterprise_id · user_id</text><text x="18" y="106" class="field">role · content</text></g>
  <g transform="translate(600,485)"><rect width="264" height="130" class="entity"/><text x="18" y="28" class="name">conversation_attachment</text><text x="18" y="58" class="field">conversation_id</text><text x="18" y="82" class="field">enterprise_id · user_id</text><text x="18" y="106" class="field">status · summary</text></g>
