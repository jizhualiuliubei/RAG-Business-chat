<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="permission model">
  <defs><style>.bg{fill:#ffffff}.title{font:700 28px Arial,"Microsoft YaHei";fill:#14171f}.card{fill:#fff;stroke:#dbe5ff;stroke-width:1.5;rx:20}.h{font:700 18px Arial,"Microsoft YaHei";fill:#14171f}.t{font:13px Arial,"Microsoft YaHei";fill:#555f73}.line{stroke:#555f73;stroke-width:2;fill:none;marker-end:url(#a)}.chip{fill:#f4f7ff;stroke:#bac9f4;rx:14}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="#555f73"/></marker></defs>
  <rect width="1100" height="560" class="bg"/><text x="52" y="55" class="title">三类角色与权限边界</text>
  <rect x="70" y="115" width="270" height="310" class="card"/><text x="105" y="160" class="h">系统管理员</text><text x="105" y="205" class="t">企业 CRUD 与审核</text><text x="105" y="235" class="t">平台模型配置</text><text x="105" y="265" class="t">跨企业用户治理</text><text x="105" y="295" class="t">代管企业视角</text><text x="105" y="325" class="t">审计日志查看</text>
  <rect x="415" y="115" width="270" height="310" class="card"/><text x="450" y="160" class="h">企业管理员</text><text x="450" y="205" class="t">本企业员工管理</text><text x="450" y="235" class="t">本企业模型 Key</text><text x="450" y="265" class="t">知识库与文档治理</text><text x="450" y="295" class="t">本企业评测中心</text><text x="450" y="325" class="t">企业设置</text>
  <rect x="760" y="115" width="270" height="310" class="card"/><text x="795" y="160" class="h">企业员工</text><text x="795" y="205" class="t">本企业知识库问答</text><text x="795" y="235" class="t">自己的会话历史</text><text x="795" y="265" class="t">自己的会话附件</text><text x="795" y="295" class="t">引用证据查看</text><text x="795" y="325" class="t">不能进入后台治理</text>
  <path d="M340 270 L415 270" class="line"/><path d="M685 270 L760 270" class="line"/>
  <rect x="195" y="465" width="710" height="45" class="chip"/><text x="250" y="493" class="t">核心规则：enterprise_id 隔离企业数据，user_id 隔离会话、消息与附件。</text>
</svg>
