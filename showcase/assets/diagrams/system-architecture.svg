<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="RAG Business Chat system architecture">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14171f" flood-opacity="0.10"/></filter>
    <style>.title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#14171f}.label{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#14171f}.small{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#555f73}.box{fill:#fff;stroke:#dbe5ff;stroke-width:1.4;rx:18;filter:url(#shadow)}.blue{fill:#f4f7ff;stroke:#bac9f4}.green{fill:#d9f4ef;stroke:#2f9e8a}.amber{fill:#fdf4e3;stroke:#e0a83e}.line{stroke:#2454d6;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#2454d6"/></marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="60" y="58" class="title">RAG Business Chat 系统整体架构</text>
  <rect x="60" y="110" width="260" height="420" class="box blue"/>
  <text x="90" y="150" class="label">Vue3 前端工作台</text>
  <text x="90" y="190" class="small">平台首页 / 对话问答</text><text x="90" y="220" class="small">后台管理 / 企业治理</text><text x="90" y="250" class="small">知识库治理 / 文档抽屉</text><text x="90" y="280" class="small">RAG 评测中心</text><text x="90" y="310" class="small">附件上传与引用证据链</text>
  <rect x="470" y="92" width="300" height="470" class="box"/>
  <text x="500" y="132" class="label">FastAPI 后端服务</text>
  <rect x="500" y="165" width="240" height="54" rx="12" fill="#f4f7ff" stroke="#dbe5ff"/><text x="520" y="198" class="small">Auth / RBAC / Tenant Context</text>
  <rect x="500" y="235" width="240" height="54" rx="12" fill="#f4f7ff" stroke="#dbe5ff"/><text x="520" y="268" class="small">Knowledge Base / Documents</text>
  <rect x="500" y="305" width="240" height="54" rx="12" fill="#f4f7ff" stroke="#dbe5ff"/><text x="520" y="338" class="small">RAG / Hybrid Search / Rerank</text>
  <rect x="500" y="375" width="240" height="54" rx="12" fill="#f4f7ff" stroke="#dbe5ff"/><text x="520" y="408" class="small">Agent / Memory / MCP Tools</text>
  <rect x="500" y="445" width="240" height="54" rx="12" fill="#f4f7ff" stroke="#dbe5ff"/><text x="520" y="478" class="small">Evaluation / Reports / Audit</text>
  <rect x="870" y="96" width="260" height="112" class="box green"/><text x="900" y="136" class="label">MySQL / SQLite</text><text x="900" y="174" class="small">企业、用户、知识库、会话、评测、审计</text>
  <rect x="870" y="250" width="260" height="112" class="box amber"/><text x="900" y="290" class="label">Zilliz / Milvus</text><text x="900" y="328" class="small">统一 collection + enterprise_id/kb_id 过滤</text>
  <rect x="870" y="404" width="260" height="112" class="box blue"/><text x="900" y="444" class="label">DeepSeek / SiliconFlow</text><text x="900" y="482" class="small">企业级 Key 路由、连接测试、遮罩展示</text>
  <path d="M320 320 C380 320 410 320 470 320" class="line"/>
  <path d="M770 150 C820 150 830 150 870 150" class="line"/>
  <path d="M770 320 C820 320 830 306 870 306" class="line"/>
  <path d="M770 455 C820 455 830 460 870 460" class="line"/>
  <rect x="108" y="585" width="984" height="44" rx="22" fill="#ffffff" stroke="#dbe5ff"/><text x="145" y="612" class="small">Nginx 提供静态资源与 API 反向代理，systemd 托管后端服务，生产环境使用 MySQL + Zilliz Cloud。</text>
</svg>
